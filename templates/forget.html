<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("forget bg.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.525); 
            width: 380px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .card h2 {
            color: #2d2d6f;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #6b6b8a;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 12px;
            color: #6b6b8a;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            font-size: 14px;
            background: #f2f5ff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4f6cff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            background: #3d58d8;
        }

        .back-link {
            margin-top: 20px;
            font-size: 13px;
        }

        .back-link a {
            color: #6b6b8a;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Forgot your password?</h2>
    <p>
        Please enter your username and we'll send you a link<br>
        to reset your password.
    </p>

    <div class="form-group">
        <label>USERNAME</label>
        <input type="email" placeholder="yourname@gmail.com">
    </div>

    <button class="btn">Reset password</button>

    <div class="back-link">
        <a href="login agri.html">Never mind, take me back to sign in</a>
    </div>
</div>

</body>
</html>
