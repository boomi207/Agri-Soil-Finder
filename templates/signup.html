{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> 

    <title>FARM CULT | Signup</title>

    <style>
        body{
            background-image: url("{% static 'harvest.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;
            width: 100vw;
            height: 100vh;
            margin: 0;
        }

        .header{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            background-color: rgb(141 56 21 / 42%);
        }

        .logo{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img{
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .header h1{
            margin: 0;
            color: black;
            flex: 1;
            text-align: center;
        }

        .signin-btn{
            text-decoration: none;
            background-color: #2119798b;
            color: #d1d8d3;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 16px;
        }

        form{
            width: 350px;
            margin: 100px auto;
            padding: 60px;
            background-color: #cbe1c759;
            border-radius: 30px;
            text-align: center;
            font-size: large;
        }

        .form-group{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            justify-content: center;
        }

        .form-group i{
            font-size: 18px;
            color: black;
        }

        .form-group input{
            width: 200px;
            padding: 10px;
            border-radius: 50px;
            border: 1px solid #ccc;
            text-align: center;
            background-color: rgba(255,255,255,0.6);
            color: black;
        }

        button{
            margin-top: 15px;
            background-color: #2119798b;
            color: white;
            border-radius: 100px;
            padding: 8px 25px;
            border: none;
            cursor: pointer;
        }

        input::placeholder{
            color: #050504;
        }

        a{
            color: black;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <div class="logo">
        <img src="{% static 'agriculture-photo.jpg' %}" alt="Logo">
    </div>

    <h1>AGRICULTURE</h1>

    <a href="{% url 'login' %}" class="signin-btn">Login</a>
</div>

<form method="POST">
    {% csrf_token %}
    <h2>SIGNUP FORM</h2>

    <div class="form-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="username" placeholder="Username" required>
    </div>

    <div class="form-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" name="email" placeholder="Email" required>
    </div>

    <div class="form-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password1" placeholder="Password" required>
    </div>

    <div class="form-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password2" placeholder="Confirm Password" required>
    </div>

    <button type="submit">Signup</button>

    <p style="margin-top:20px;">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>
</form>

</body>
</html>
